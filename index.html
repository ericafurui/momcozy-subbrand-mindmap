<head>
<meta charset="UTF-8">

<title>Momcozy 子品牌产品思维导图（一级类目版）</title>
<style>
:root {
  --bg: #F7F3EE;
  --text: #3A3028;
  --muted: #8A7E72;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  overflow: hidden;
}
#canvas { width: 100vw; height: 100vh; cursor: grab; overflow: hidden; position: relative; }
#canvas:active { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#links { position: absolute; overflow: visible; pointer-events: none; }
#nodes { position: absolute; left: 0; top: 0; }

.node {
  position: absolute;
  display: inline-flex; align-items: center; gap: 7px;
  white-space: nowrap;
  border-radius: 14px;
  cursor: pointer;
  user-select: none;
  transition: left .3s ease, top .3s ease;
  padding: 6px 14px;
  font-size: 13px;
  background: #FFFDFB;
  border: 1px solid #E5DCD3;
  box-shadow: 0 1px 2px rgba(58,48,40,0.04);
  z-index: 2;
}
.node:hover { box-shadow: 0 3px 8px rgba(58,48,40,0.12); z-index: 5; }

.t-root {
  background: #3A3028; color: #FFF; font-size: 16px; font-weight: 600;
  padding: 11px 20px; border-radius: 22px; border: none;
}
.t-brand {
  background: var(--c); color: #FFF; font-size: 14.5px; font-weight: 600;
  padding: 8px 16px; border-radius: 17px; border: none;
}
.t-cat1 {
  background: #FFF; border: 1.5px solid var(--c);
  font-size: 13px; font-weight: 500; padding: 5px 12px;
  border-radius: 12px;
}
.t-cat1 .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--c); flex: none;
}
.t-cat2 {
  background: #FFFDFB; border: 1px solid var(--c);
  font-size: 12.5px; font-weight: 500; padding: 4px 11px;
  border-radius: 11px;
}
.t-cat3 {
  background: var(--c); color: #FFF;
  font-size: 12.5px; font-weight: 700; padding: 4px 12px;
  border: none; border-radius: 11px;
  box-shadow: 0 3px 10px rgba(58,48,40,0.22);
}
.t-l1 {
  background: #F6F1EC; border: 1px dashed #D6CABC;
  font-size: 12px; padding: 3px 10px; color: #6B5F55;
  border-radius: 11px;
}
.t-l2 {
  background: #F1EBE4; border: 1px dotted #D6CABC;
  font-size: 11.5px; padding: 2px 9px; color: #7A6E63;
  border-radius: 10px;
}
.badge.cnt {
  font-size: 9.5px; line-height: 1;
  padding: 1.5px 5px; border-radius: 7px;
  background: transparent; color: inherit;
  flex: none; font-weight: 400; opacity: 0.55;
}
.t-root .badge.cnt, .t-brand .badge.cnt { background: rgba(255,255,255,0.18); opacity: 0.9; }
.badge.fold {
  font-size: 10px; line-height: 1;
  flex: none; font-weight: 700;
  background: transparent; color: var(--c);
  padding: 1px 0 1px 4px; opacity: 0.7;
  transition: transform .15s;
}
.t-cat3 .badge.fold { color: #FFF; opacity: 0.9; }
.t-cat3 .badge.cnt { opacity: 0.85; }

.lv {
  font-size: 9px; line-height: 1; letter-spacing: .5px;
  padding: 2px 5px; border-radius: 5px;
  background: rgba(0,0,0,0.055); color: var(--c);
  font-weight: 700; flex: none;
  border: 1px solid rgba(0,0,0,0.06);
}
.t-cat3 .lv { background: rgba(255,255,255,0.92); color: var(--c); border: none; font-size: 9.5px; }
.t-l1 .lv, .t-l2 .lv { background: transparent; border: 1px dashed #C9BEB2; color: #8A7E72; font-weight: 600; }

#hud {
  position: fixed; left: 20px; top: 16px; z-index: 100;
  background: rgba(255,253,251,0.93); border: 1px solid #E8DFD6;
  border-radius: 12px; padding: 12px 14px;
  box-shadow: 0 2px 8px rgba(58,48,40,0.06);
  max-width: 470px;
}
#hud h1 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
#hud p { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 7px; }
.legend { display: flex; flex-direction: column; gap: 3px; }
.legend .lg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5A5048; }
.legend .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
#controls {
  position: fixed; right: 20px; bottom: 20px; z-index: 100;
  display: flex; flex-direction: column; gap: 8px;
}
.btn {
  min-width: 74px; height: 34px;
  border-radius: 17px; border: 1px solid #E5DCD3;
  background: #FFFDFB; color: var(--text);
  font-size: 12px; cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  display: flex; align-items: center; justify-content: center;
  padding: 0 12px;
}
.btn:hover { background: #FFF6EF; }
.btn.round { min-width: 34px; width: 34px; border-radius: 50%; font-size: 17px; }
</style>
</head>

  </div>
</div>

function makeNode(name, type, color, count) {
  const n = { name, type, color, count: count || 0, children: [], collapsed: false,
              x: 0, y: 0, w: 0, h: 0, sh: 0 };
  const el = document.createElement('div');
  el.className = 'node t-' + type;
  el.style.setProperty('--c', color);
  if (LV_LABEL[type]) {
    const lv = document.createElement('span');
    lv.className = 'lv';
    lv.textContent = LV_LABEL[type];
    el.appendChild(lv);
  }
  const label = document.createElement('span');
  label.textContent = name;
  el.appendChild(label);
  if (type !== 'root') {
    const cnt = document.createElement('span');
    cnt.className = 'badge cnt';
    el.appendChild(cnt);
  }
  n.el = el; n.labelEl = label;
  nodesLayer.appendChild(el);
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!n.children.length) return;
    n.collapsed = !n.collapsed;
    layout();
  });
  return n;
}

const root = makeNode('Momcozy 全产品', 'root', '#3A3028', 0);
const brandNodes = [];
RAW.forEach(d => {
  const brand = makeNode(d.name, 'brand', d.color, d.count);
  root.children.push(brand); brandNodes.push(brand);
  (d.children || []).forEach(d2 => {              // 一级类目
    const c1 = makeNode(d2.name, 'cat1', d.color, d2.count);
    brand.children.push(c1);
    (d2.children || []).forEach(d3 => {           // 二级类目（默认折叠 → 三级类目隐藏）
      const c2 = makeNode(d3.name, 'cat2', d.color, d3.count);
      c2.collapsed = true;
      c1.children.push(c2);
      (d3.children || []).forEach(d4 => {         // 三级类目（默认隐藏）
        const c3 = makeNode(d4.name, 'cat3', d.color, d4.count);
        c3.collapsed = true;
        c2.children.push(c3);
        (d4.children || []).forEach(d5 => {       // L1 场景（默认隐藏）
          const l1 = makeNode(d5.name, 'l1', d.color, d5.count);
          l1.collapsed = true;
          c3.children.push(l1);
          (d5.children || []).forEach(d6 => {     // L2 场景（叶子）
            const l2 = makeNode(d6.name, 'l2', d.color, d6.count);
            l1.children.push(l2);
          });
        });
      });
    });
  });
});

// 测量
function measure(n) {
  n.w = n.el.offsetWidth; n.h = n.el.offsetHeight;
  n.children.forEach(measure);
}
root.children.forEach(measure);
measure(root);

// 分侧：按数据里的 side 字段（母品牌 + natural 右，life 左）
const rightSide = [], leftSide = [];
RAW.forEach((d, i) => {
  (d.side === 'left' ? leftSide : rightSide).push(brandNodes[i]);
});
if (!leftSide.length && rightSide.length > 1) leftSide.push(rightSide.pop());
if (!rightSide.length && leftSide.length > 1) rightSide.push(leftSide.pop());

function sideHeight(side) {
  return side.reduce((s, n) => s + n.sh, 0) + GROUP_GAP * Math.max(0, side.length - 1);
}

function measureSh(n) {
  if (n.collapsed || !n.children.length) { n.sh = n.h; return; }
  let s = 0;
  n.children.forEach(c => { measureSh(c); s += c.sh; });
  n.sh = Math.max(n.h, s + SIB * (n.children.length - 1));
}

function place(n, x, yCenter, dir) {
  n.x = x; n.y = yCenter - n.h / 2;
  n.el.style.left = n.x + 'px';
  n.el.style.top = n.y + 'px';
  if (n.collapsed || !n.children.length) return;
  const total = n.children.reduce((s, c) => s + c.sh, 0) + SIB * (n.children.length - 1);
  let cur = yCenter - total / 2;
  n.children.forEach(c => {
    const cx = dir > 0 ? n.x + n.w + GAPX : n.x - GAPX - c.w;
    place(c, cx, cur + c.sh / 2, dir);
    cur += c.sh + SIB;
  });
}

function setVisibility(n, visible) {
  n.el.style.display = visible ? '' : 'none';
  if (!visible) { n.children.forEach(c => setVisibility(c, false)); return; }
  if (n.collapsed) { n.children.forEach(c => setVisibility(c, false)); return; }
  n.children.forEach(c => setVisibility(c, true));
}

function updateBadges(n) {
  const hasKids = n.children.length > 0;
  let badge = n.el.querySelector('.badge.fold');
  if (hasKids) {
    if (!badge) { badge = document.createElement('span'); badge.className = 'badge fold'; n.el.appendChild(badge); }
    badge.textContent = n.collapsed ? '›' : '⌄';
  } else if (badge) badge.remove();
  // 数字 = 下一层节点数；1:1 层级（cat3→L1场景、L1→L2场景）默认不标，仅多个时显示
  const cntEl = n.el.querySelector('.badge.cnt');
  if (cntEl) {
    let show = false;
    if (hasKids) {
      if (n.type === 'brand' || n.type === 'cat1' || n.type === 'cat2') show = true;
      else if ((n.type === 'cat3' || n.type === 'l1') && n.children.length > 1) show = true;
    }
    cntEl.textContent = show ? n.children.length : '';
    cntEl.style.display = show ? '' : 'none';
  }
  n.children.forEach(updateBadges);
}

let minX = 0, minY = 0, bboxW = 0, bboxH = 0;

function linkPath(n, c, dir) {
  const px = dir > 0 ? n.x + n.w : n.x;
  const py = n.y + n.h / 2;
  const cx = dir > 0 ? c.x : c.x + c.w;
  const cy = c.y + c.h / 2;
  const dx = Math.abs(cx - px) * 0.45;
  const stroke = (c.type === 'brand' || n.type === 'root') ? c.color : n.color;
  return `<path d="M ${px - minX} ${py - minY} C ${px - minX + dir * dx} ${py - minY}, ${cx - minX - dir * dx} ${cy - minY}, ${cx - minX} ${cy - minY}" stroke="${stroke}" stroke-width="1.6" fill="none" opacity="0.55"/>`;
}

function drawLinks(n, dir, paths) {
  if (n.el.style.display === 'none' || n.collapsed) return paths;
  n.children.forEach(c => {
    if (c.el.style.display === 'none') return;
    paths += linkPath(n, c, dir);
    paths = drawLinks(c, dir, paths);
  });
  return paths;
}

function layout() {
  brandNodes.forEach(measureSh);
  const Hr = sideHeight(rightSide), Hl = sideHeight(leftSide);
  root.x = 0; root.y = -root.h / 2;
  root.el.style.left = '0px'; root.el.style.top = root.y + 'px';

  let cur = -Hr / 2;
  rightSide.forEach(n => { place(n, root.w + GAPX + 20, cur + n.sh / 2, 1); cur += n.sh + GROUP_GAP; });
  cur = -Hl / 2;
  leftSide.forEach(n => { place(n, -GAPX - 20 - n.w, cur + n.sh / 2, -1); cur += n.sh + GROUP_GAP; });

  setVisibility(root, true);
  updateBadges(root);

  minX = Infinity; minY = Infinity; let maxX = -Infinity, maxY = -Infinity;
  function bbox(n) {
    if (n.el.style.display === 'none') return;
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
    n.children.forEach(bbox);
  }
  bbox(root);
  bboxW = maxX - minX + 80; bboxH = maxY - minY + 80;
  minX -= 40; minY -= 40;

  linksSvg.setAttribute('width', bboxW);
  linksSvg.setAttribute('height', bboxH);
  linksSvg.style.left = minX + 'px';
  linksSvg.style.top = minY + 'px';
  let paths = '';
  if (root.el.style.display !== 'none' && !root.collapsed) {
    rightSide.forEach(c => {
      if (c.el.style.display === 'none') return;
      paths += linkPath(root, c, 1);
      paths = drawLinks(c, 1, paths);
    });
    leftSide.forEach(c => {
      if (c.el.style.display === 'none') return;
      paths += linkPath(root, c, -1);
      paths = drawLinks(c, -1, paths);
    });
  }
  linksSvg.innerHTML = paths;
}

// ---- pan & zoom ----
let scale = 1, panX = 0, panY = 0;
function apply() {
  world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min((vw - 60) / bboxW, (vh - 100) / bboxH, 1);
  scale = Math.max(scale, 0.35);
  panX = (vw - bboxW * scale) / 2 - minX * scale;
  panY = (vh - bboxH * scale) / 2 - minY * scale + 10;
  apply();
}

layout();
fit();

let dragging = false, lx = 0, ly = 0;
canvas.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  panX += e.clientX - lx; panY += e.clientY - ly;
  lx = e.clientX; ly = e.clientY; apply();
});
window.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 0.9 : 1.1;
  const ns = Math.min(Math.max(scale * f, 0.2), 2.5);
  const mx = e.clientX, my = e.clientY;
  panX = mx - (mx - panX) * (ns / scale);
  panY = my - (my - panY) * (ns / scale);
  scale = ns; apply();
}, { passive: false });

document.getElementById('btnIn').onclick = () => { scale = Math.min(scale * 1.2, 2.5); apply(); };
document.getElementById('btnOut').onclick = () => { scale = Math.max(scale * 0.83, 0.2); apply(); };
document.getElementById('btnReset').onclick = () => fit();

document.getElementById('btnScenes').onclick = () => {
  function walk(n) { n.collapsed = false; n.children.forEach(walk); }
  walk(root); layout(); fit();
};
document.getElementById('btnCollapse').onclick = () => {
  function walk(n) {
    if (n.type === 'cat2' || n.type === 'cat3' || n.type === 'l1') n.collapsed = true;
    n.children.forEach(walk);
  }
  walk(root); layout(); fit();
};
</script>
</body>
</html>
